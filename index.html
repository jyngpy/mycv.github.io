<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>粤味菜单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f5f5f5;
    overflow-x:hidden;
    color:#333;
}

/* 顶部 */

.header{
    position:sticky;
    top:0;
    z-index:999;
    background:linear-gradient(135deg,#ffcc70,#ff9f43);
    padding:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.shop-title{
    color:#fff;
    font-size:24px;
    font-weight:700;
    margin-bottom:12px;
}

/* 搜索框 */

.search-box{
    background:#fff;
    border-radius:999px;
    padding:12px 16px;
    display:flex;
    align-items:center;
}

.search-box input{
    border:none;
    outline:none;
    width:100%;
    font-size:15px;
    background:none;
}

/* 菜品区域 */

.food-container{
    padding:14px 12px 100px;
}

.food-card{
    display:flex;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.food-img{
    width:110px;
    height:110px;
    object-fit:cover;
    flex-shrink:0;
}

.food-info{
    flex:1;
    padding:12px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.food-name{
    font-size:17px;
    font-weight:700;
    margin-bottom:6px;
}

.food-desc{
    font-size:13px;
    color:#777;
    line-height:1.5;
}

.food-bottom{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
}

.add-btn{
    border:none;
    background:linear-gradient(135deg,#ffb347,#ff7b00);
    color:#fff;
    padding:10px 16px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
}

.add-btn:active{
    transform:scale(.96);
}

/* 购物车 */

.cart-btn{
    position:fixed;
    right:16px;
    bottom:26px;
    width:64px;
    height:64px;
    border-radius:50%;
    background:linear-gradient(135deg,#ffb347,#ff7b00);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:30px;
    box-shadow:0 6px 18px rgba(0,0,0,.2);
    z-index:999;
}

.cart-count{
    position:absolute;
    top:-3px;
    right:-3px;
    background:red;
    color:#fff;
    font-size:12px;
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* 弹窗 */

.cart-popup{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    z-index:1000;
}

.cart-content{
    width:100%;
    max-height:75%;
    background:#fff;
    border-radius:24px 24px 0 0;
    padding:20px;
    overflow-y:auto;
}

.cart-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:16px;
}

.cart-item{
    background:#fff7eb;
    padding:14px;
    border-radius:14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.remove-btn{
    border:none;
    background:#ff4d4f;
    color:#fff;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
}

.close-btn{
    width:100%;
    border:none;
    background:#ff8f1f;
    color:#fff;
    padding:14px;
    border-radius:999px;
    font-size:16px;
    margin-top:12px;
}

.empty{
    text-align:center;
    color:#999;
    padding:30px 0;
}

/* 手机适配 */

@media(max-width:380px){

    .food-img{
        width:95px;
        height:95px;
    }

    .food-name{
        font-size:15px;
    }

}

</style>
</head>

<body>

<!-- 顶部 -->

<div class="header">

    <div class="shop-title">
        🍜 粤味菜单
    </div>

    <div class="search-box">
        🔍
        <input type="text"
        id="searchInput"
        placeholder="搜索菜品..."
        onkeyup="searchFood()">
    </div>

</div>

<!-- 菜品列表 -->

<div class="food-container" id="foodContainer"></div>

<!-- 购物车 -->

<div class="cart-btn" onclick="openCart()">

    🛒

    <div class="cart-count" id="cartCount">
        0
    </div>

</div>

<!-- 购物车弹窗 -->

<div class="cart-popup" id="cartPopup">

    <div class="cart-content">

        <div class="cart-title">
            📋 今日菜单
        </div>

        <div id="cartItems">

            <div class="empty">
                还没有添加菜品哦～
            </div>

        </div>

        <button class="close-btn" onclick="closeCart()">
            关闭菜单
        </button>

    </div>

</div>

<script>

/* 100道粤菜 */

const foods = [

"蜜汁叉烧",
"白切鸡",
"广式烧鹅",
"豉汁蒸排骨",
"干炒牛河",
"云吞面",
"艇仔粥",
"鲜虾肠粉",
"虾饺皇",
"凤爪蒸排骨",
"腊味煲仔饭",
"清蒸鲈鱼",
"烧味双拼",
"陈皮牛肉丸",
"牛肉肠粉",
"咸鱼鸡粒炒饭",
"叉烧包",
"流沙奶黄包",
"豉汁凤爪",
"豉油皇炒面",

"鼓汁蒸凤爪",
"蚝油生菜",
"白灼菜心",
"白灼虾",
"椒盐濑尿虾",
"避风塘炒蟹",
"清蒸多宝鱼",
"豉汁蒸鱼头",
"鲍汁扣鹅掌",
"鲍鱼焖鸡",
"红烧乳鸽",
"叉烧炒饭",
"瑶柱蛋白炒饭",
"鲜虾云吞",
"牛腩面",
"牛三星",
"猪杂粥",
"皮蛋瘦肉粥",
"及第粥",
"干蒸烧卖",

"马拉糕",
"萝卜糕",
"香煎芋头糕",
"糯米鸡",
"荷叶饭",
"咸水角",
"炸鲜奶",
"姜撞奶",
"双皮奶",
"杨枝甘露",
"红豆沙",
"芝麻糊",
"杏仁茶",
"椰汁西米露",
"莲子百合糖水",
"凤爪排骨饭",
"豉汁排骨饭",
"烧鸭饭",
"烧鹅饭",
"叉烧饭",

"滑蛋牛肉饭",
"梅菜扣肉饭",
"香菇滑鸡饭",
"咕噜肉",
"菠萝咕噜肉",
"蒜蓉蒸扇贝",
"蒜香骨",
"蜜椒鸡翅",
"白灼芥兰",
"上汤娃娃菜",
"潮州卤水拼盘",
"卤水鹅肠",
"卤水鸭掌",
"凉拌海蜇",
"凉瓜炒牛肉",
"苦瓜排骨汤",
"老火靓汤",
"胡椒猪肚鸡",
"花胶鸡汤",
"玉米红萝卜排骨汤",

"番茄牛腩",
"冬瓜盅",
"咸蛋黄焗南瓜",
"椒盐豆腐",
"酿豆腐",
"客家酿苦瓜",
"梅菜蒸肉饼",
"咸鱼蒸肉饼",
"虾酱啫啫煲",
"啫啫鸡煲",
"豉汁炒蚬",
"炒田螺",
"香煎马鲛鱼",
"鱼香茄子煲",
"豉椒炒牛肉",
"椒盐九肚鱼",
"广式腊肠",
"烧排骨",
"豉汁凉瓜排骨",
"豉油鸡"

];

const container = document.getElementById("foodContainer");

/* 渲染菜品 */

foods.forEach(food=>{

    container.innerHTML += `

    <div class="food-card">

        <img class="food-img"
        src="https://upload.wikimedia.org/wikipedia/commons/0/05/Doraemon_200211.jpg">

        <div class="food-info">

            <div>

                <div class="food-name">
                    ${food}
                </div>

                <div class="food-desc">
                    地道粤式风味，现点现做，欢迎加入今日菜单。
                </div>

            </div>

            <div class="food-bottom">

                <button class="add-btn"
                onclick="addMenu('${food}')">

                    添加

                </button>

            </div>

        </div>

    </div>

    `;

});

/* 菜单数组 */

let menuArr = [];

const cartItems = document.getElementById("cartItems");
const cartCount = document.getElementById("cartCount");
const cartPopup = document.getElementById("cartPopup");

/* 添加 */

function addMenu(name){

    if(menuArr.includes(name)){

        alert("这个菜已经添加过啦～");
        return;

    }

    menuArr.push(name);

    renderCart();

}

/* 渲染购物车 */

function renderCart(){

    cartCount.innerText = menuArr.length;

    if(menuArr.length === 0){

        cartItems.innerHTML = `
        <div class="empty">
            还没有添加菜品哦～
        </div>
        `;

        return;

    }

    cartItems.innerHTML = "";

    menuArr.forEach((item,index)=>{

        cartItems.innerHTML += `

        <div class="cart-item">

            <span>${item}</span>

            <button class="remove-btn"
            onclick="removeItem(${index})">

                删除

            </button>

        </div>

        `;

    });

}

/* 删除 */

function removeItem(index){

    menuArr.splice(index,1);

    renderCart();

}

/* 打开 */

function openCart(){

    cartPopup.style.display = "flex";

}

/* 关闭 */

function closeCart(){

    cartPopup.style.display = "none";

}

/* 搜索 */

function searchFood(){

    let input =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

    let cards =
    document.querySelectorAll(".food-card");

    cards.forEach(card=>{

        let name =
        card.querySelector(".food-name")
        .innerText
        .toLowerCase();

        if(name.includes(input)){

            card.style.display = "flex";

        }else{

            card.style.display = "none";

        }

    });

}

/* 点击空白关闭 */

cartPopup.addEventListener("click",function(e){

    if(e.target === cartPopup){

        closeCart();

    }

});

</script>

</body>
</html>
