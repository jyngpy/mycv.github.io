<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短视频免费去水印解析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme:{
                extend:{
                    colors:{
                        main:'#ff4d4f',
                        dark:'#1f2937'
                    }
                }
            }
        }
    </script>
    <style>
        body{background: linear-gradient(135deg,#f5f7fa,#e4e8f0);min-height:100vh;}
        .box-shadow-all{box-shadow: 0 8px 30px rgba(0,0,0,0.12);}
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <!-- 头部 -->
        <div class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-dark">短视频去水印解析</h1>
            <p class="text-gray-500 mt-2">支持抖音 / 小红书 / 快手 / 视频号 免费无水印下载</p>
        </div>

        <!-- 输入卡片 -->
        <div class="bg-white rounded-2xl p-6 box-shadow-all">
            <div class="flex flex-col gap-4">
                <textarea id="videoUrl" rows="3" class="w-full border border-gray-200 rounded-xl p-4 outline-none focus:border-main transition" placeholder="粘贴短视频分享链接到此处"></textarea>
                <button onclick="parseVideo()" class="bg-main text-white py-3 rounded-xl text-lg font-medium hover:bg-red-500 transition">
                    <i class="fa fa-download mr-2"></i>一键解析去水印
                </button>
            </div>

            <!-- 加载提示 -->
            <div id="loading" class="hidden text-center py-6 text-gray-500">
                <i class="fa fa-spinner fa-spin text-2xl"></i>
                <p class="mt-2">正在解析中，请稍候...</p>
            </div>

            <!-- 结果展示 -->
            <div id="resultBox" class="hidden mt-6 border-t pt-6">
                <div class="space-y-3">
                    <p class="text-gray-700"><span class="font-semibold">视频标题：</span><span id="videoTitle"></span></p>
                    <div class="flex flex-wrap gap-3 mt-4">
                        <a id="downBtn" href="" target="_blank" class="inline-block bg-green-500 text-white px-5 py-2 rounded-lg">
                            <i class="fa fa-download mr-1"></i>立即下载视频
                        </a>
                        <a id="imgBtn" href="" target="_blank" class="hidden inline-block bg-blue-500 text-white px-5 py-2 rounded-lg">
                            <i class="fa fa-picture-o mr-1"></i>下载图文图片
                        </a>
                    </div>
                </div>
            </div>

            <!-- 错误提示 -->
            <div id="errBox" class="hidden mt-4 text-red-500 text-center"></div>
        </div>

        <!-- 使用说明 -->
        <div class="mt-6 bg-white rounded-xl p-5 box-shadow-all text-sm text-gray-600">
            <h3 class="font-bold text-dark mb-2">使用教程</h3>
            <p>1. 打开短视频APP → 分享 → 复制链接</p>
            <p>2. 将链接粘贴到上方输入框</p>
            <p>3. 点击一键解析，即可无水印保存</p>
            <p class="mt-2 text-red-400">温馨提示：仅个人学习备份使用，禁止商用侵权</p>
        </div>

        <!-- 底部 -->
        <div class="text-center text-gray-400 text-xs mt-6">纯静态页面 · 无需后台 · 本地离线可用</div>
    </div>

    <script>
        // 优先免费公共解析接口
        const apiList = [
            "https://v1.alapi.cn/api/video/url?url=",
            "https://jx.douyinapi.cn/api/jx?url="
        ];
        let apiIndex = 0;

        function parseVideo(){
            let url = document.getElementById('videoUrl').value.trim();
            if(!url){
                alert("请粘贴短视频分享链接！");
                return;
            }
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultBox').classList.add('hidden');
            document.getElementById('errBox').classList.add('hidden');

            let api = apiList[apiIndex] + encodeURIComponent(url);
            fetch(api)
            .then(res=>res.json())
            .then(data=>{
                document.getElementById('loading').classList.add('hidden');
                if(data.code===200 && data.data.url){
                    document.getElementById('videoTitle').innerText = data.data.title || "无标题";
                    document.getElementById('downBtn').href = data.data.url;
                    document.getElementById('resultBox').classList.remove('hidden');
                }else{
                    apiIndex++;
                    if(apiIndex < apiList.length){
                        parseVideo();
                    }else{
                        document.getElementById('errBox').innerText = "解析失败，链接错误或接口限流，请更换链接重试";
                        document.getElementById('errBox').classList.remove('hidden');
                        apiIndex = 0;
                    }
                }
            })
            .catch(()=>{
                document.getElementById('loading').classList.add('hidden');
                apiIndex++;
                if(apiIndex < apiList.length){
                    parseVideo();
                }else{
                    document.getElementById('errBox').innerText = "网络异常，解析失败";
                    document.getElementById('errBox').classList.remove('hidden');
                    apiIndex = 0;
                }
            })
        }

        // 清空输入
        document.onkeydown=function(e){
            if(e.keyCode===13) parseVideo();
        }
    </script>
</body>
</html>
